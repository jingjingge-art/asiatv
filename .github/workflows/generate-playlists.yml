name: Generate regional playlists

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate playlists
        run: python3 scripts/organize_playlist.py --output-dir .
      - name: Commit generated playlists
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 亚洲地区.m3u 中文频道.m3u 分类报告.json
          if ! git diff --cached --quiet; then
            git commit -m "Update generated Asia TV playlists"
            git push
          fi
